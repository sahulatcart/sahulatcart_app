# P6 (FR-P6.6): every pull request must build, typecheck, test and lint. Branch protection on main
# requires this workflow (set in GitHub by Fazal). The backend tests run against the fake database
# and dummy env from backend/vitest.config.ts; nothing here reaches a real service.
name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:shared
      - run: npm run typecheck
      - run: npm run typecheck -w @app/admin
      - run: npm run test -w @app/backend
      - run: npm run lint -w @app/admin
