# nginx config for the marketing site.
#
# Written straight into /etc/nginx/conf.d/ at build time rather than left as a
# template in /etc/nginx/templates/. Railway's custom start command replaces the
# image's ENTRYPOINT, so /docker-entrypoint.sh never runs, so envsubst never
# turns a template into a config. A template here is silently ignored — which is
# why try_files never took effect and /privacy 404'd for weeks.
#
# Port is fixed at 80 to match ENV PORT / EXPOSE in the Dockerfile.

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Serve /privacy for /privacy.html, etc.
  location / {
    try_files $uri $uri.html $uri/ =404;
  }

  # ── Redirects from the previous site on this domain ────────────────
  # The domain used to host a Next.js marketing site, and before that a
  # WooCommerce shop. Both are indexed by Google and every path 404s.
  # 301 preserves whatever ranking signal those URLs carry.

  # Previous marketing site paths that do not map by name
  location = /privacy-policy { return 301 /privacy.html; }
  location = /contact        { return 301 /demo.html; }
  location = /book-a-demo    { return 301 /demo.html; }
  location = /terms-of-service { return 301 /terms.html; }

  # Previous WooCommerce shop — no equivalent pages, send to the homepage
  location = /shop        { return 301 /; }
  location = /cart        { return 301 /; }
  location = /checkout    { return 301 /; }
  location = /my-account  { return 301 /; }
  location ^~ /product/          { return 301 /; }
  location ^~ /product-category/ { return 301 /; }
  location ^~ /wp-            { return 301 /; }

  # ── Caching ────────────────────────────────────────────────────────
  # Hashless asset filenames, so keep the window short enough that a deploy
  # is picked up without a hard refresh.
  location ~* \.(css|js)$ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=3600, must-revalidate";
  }
  location ~* \.(png|jpg|jpeg|gif|svg|webp|ico|woff2?)$ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=604800";
  }
  location ~* \.html$ {
    add_header Cache-Control "public, max-age=300, must-revalidate";
  }

  # robots.txt and sitemap.xml must always be fresh for crawlers
  location = /robots.txt  { add_header Cache-Control "public, max-age=300"; }
  location = /sitemap.xml { add_header Cache-Control "public, max-age=300"; }

  # ── Basic hardening ────────────────────────────────────────────────
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;
  gzip_min_length 512;
}
